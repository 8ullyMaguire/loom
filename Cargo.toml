[workspace]
resolver = "2"
members = ["crates/loom-core", "crates/loom-store", "crates/loom-api", "crates/loom-cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
loom-core = { path = "crates/loom-core" }
loom-store = { path = "crates/loom-store" }
loom-api = { path = "crates/loom-api" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "uuid", "time", "json", "macros"] }
axum = "0.8"
utoipa = { version = "5", features = ["axum_extras", "uuid"] }
reqwest = { version = "0.12", features = ["json"] }
clap = { version = "4", features = ["derive"] }
uuid = { version = "1", features = ["v4", "serde"] }
time = { version = "0.3", features = ["serde"] }
sha2 = "0.10"
rand = "0.8"
base64 = "0.22"
anyhow = "1"
thiserror = "2"
ratatui = "0.29"
crossterm = "0.28"
tower-http = { version = "0.6", features = ["cors", "trace"] }
tracing = "0.1"
tracing-subscriber = "0.3"
